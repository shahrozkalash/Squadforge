name: Phase 32 Execution Infrastructure Verification

# Proves Phase 32 against a REAL Docker daemon on the runner:
#   - dockerd is reconfigured to serve TLS (client-certificate verified)
#     on tcp://127.0.0.1:2376 next to the unix socket,
#   - the gVisor runsc runtime is installed and registered,
#   - the gated integration tests then exercise TLS auth (valid and
#     wrong-CA certificates), runsc execution (verified via docker
#     inspect), memory/pids limit enforcement and teardown/sweep
#     cleanup. Nothing is mocked; a step that cannot work fails visibly.
# The Phase 32 unit tests and the Phase 10 suites run first without
# any daemon.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase32-execution-verify.yml'
      - 'server/execution/**'
      - 'tests/phase32_docker_integration.test.ts'
      - 'tests/phase32_execution_infrastructure.test.ts'

permissions:
  contents: read

jobs:
  phase32-execution-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SquadForge dependencies
        run: npm ci

      - name: Unit tests (no daemon) and Phase 10 regression
        run: >
          npx tsx --test
          tests/phase32_execution_infrastructure.test.ts
          tests/phase10_execution.test.ts
          tests/phase10_relay_auth.test.ts
          tests/execution_adapter.test.ts

      - name: Build the sandbox image
        run: docker build -t squadforge-sandbox:1 sandbox

      - name: Install gVisor (runsc)
        run: |
          set -e
          # Pinned release: the release/latest/ alias now returns 404 (proven by run 45665209774); 20251110.0 is a real, verified release.
          curl -fsSL -o /tmp/runsc https://storage.googleapis.com/gvisor/releases/release/20251110.0/x86_64/runsc
          curl -fsSL -o /tmp/runsc.sha512 https://storage.googleapis.com/gvisor/releases/release/20251110.0/x86_64/runsc.sha512
          expected="$(awk '{print $1}' /tmp/runsc.sha512)"
          actual="$(sha512sum /tmp/runsc | awk '{print $1}')"
          [ "$expected" = "$actual" ] || { echo "runsc checksum mismatch"; exit 1; }
          sudo install -m 0755 /tmp/runsc /usr/local/bin/runsc
          # Registers the runsc runtime in /etc/docker/daemon.json.
          sudo /usr/local/bin/runsc install

      - name: Generate CA, server and client certificates
        run: |
          set -e
          mkdir -p certs wrong-certs
          # CA
          openssl req -x509 -newkey rsa:2048 -keyout certs/ca-key.pem -out certs/ca.pem \
            -days 7 -nodes -subj "/CN=squadforge-phase32-ca"
          # Server certificate (SAN 127.0.0.1 / localhost)
          openssl req -newkey rsa:2048 -keyout certs/server-key.pem -out certs/server.csr \
            -nodes -subj "/CN=localhost"
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\n' > certs/server-ext.cnf
          openssl x509 -req -in certs/server.csr -CA certs/ca.pem -CAkey certs/ca-key.pem \
            -CAcreateserial -out certs/server-cert.pem -days 7 -extfile certs/server-ext.cnf
          # Client certificate
          openssl req -newkey rsa:2048 -keyout certs/key.pem -out certs/client.csr \
            -nodes -subj "/CN=squadforge-phase32-client"
          printf 'extendedKeyUsage=clientAuth\n' > certs/client-ext.cnf
          openssl x509 -req -in certs/client.csr -CA certs/ca.pem -CAkey certs/ca-key.pem \
            -CAcreateserial -out certs/cert.pem -days 7 -extfile certs/client-ext.cnf
          # A second, unrelated CA and client certificate: the daemon must reject it.
          openssl req -x509 -newkey rsa:2048 -keyout wrong-certs/ca-key.pem -out wrong-certs/ca.pem \
            -days 7 -nodes -subj "/CN=unrelated-ca"
          openssl req -newkey rsa:2048 -keyout wrong-certs/key.pem -out wrong-certs/client.csr \
            -nodes -subj "/CN=impostor"
          openssl x509 -req -in wrong-certs/client.csr -CA wrong-certs/ca.pem -CAkey wrong-certs/ca-key.pem \
            -CAcreateserial -out wrong-certs/cert.pem -days 7 -extfile certs/client-ext.cnf

      - name: Configure dockerd for TLS + runsc and restart it
        run: |
          set -e
          [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json
          jq --arg ca "$PWD/certs/ca.pem" --arg cert "$PWD/certs/server-cert.pem" --arg key "$PWD/certs/server-key.pem" \
            '. + {hosts: ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2376"],
                  tlsverify: true, tlscacert: $ca, tlscert: $cert, tlskey: $key}' \
            /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          # Ubuntu's docker unit passes -H fd://, which conflicts with the
          # hosts in daemon.json; replace it with a plain dockerd start.
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: Wait for the daemon on the socket and over TLS
        env:
          DOCKER_HOST: tcp://127.0.0.1:2376
          DOCKER_CERT_PATH: ${{ github.workspace }}/certs
          DOCKER_TLS_VERIFY: '1'
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker -H unix:///var/run/docker.sock version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker -H unix:///var/run/docker.sock version
          for i in $(seq 1 30); do
            if docker version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker version
          docker info --format 'runtimes: {{json .Runtimes}} storage: {{.Driver}}'

      - name: Genuine integration tests against the TLS + runsc daemon
        env:
          DOCKER_INTEGRATION: '1'
          DOCKER_HOST: tcp://127.0.0.1:2376
          DOCKER_TLS_CA: ${{ github.workspace }}/certs/ca.pem
          DOCKER_TLS_CERT: ${{ github.workspace }}/certs/cert.pem
          DOCKER_TLS_KEY: ${{ github.workspace }}/certs/key.pem
          PHASE32_WRONG_CA: ${{ github.workspace }}/wrong-certs/ca.pem
          PHASE32_WRONG_CERT: ${{ github.workspace }}/wrong-certs/cert.pem
          PHASE32_WRONG_KEY: ${{ github.workspace }}/wrong-certs/key.pem
          SANDBOX_IMAGE: squadforge-sandbox:1
        run: |
          set -eo pipefail
          npx tsx --test tests/phase32_docker_integration.test.ts 2>&1 | tee phase32-integration-output.txt

      - name: Validate genuine results (fail the workflow on any failed check)
        if: always()
        run: |
          set -e
          echo "Validating Phase 32 evidence (a green workflow requires every check below):"
          grep -Eq '# pass [1-9][0-9]*' phase32-integration-output.txt || { echo "FAIL: integration suite reported no passing tests"; exit 1; }
          grep -q '# fail 0' phase32-integration-output.txt || { echo "FAIL: integration suite reported failures"; exit 1; }
          echo "All Phase 32 checks passed."

      - name: Upload integration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase32-integration-output
          path: phase32-integration-output.txt
          if-no-files-found: warn
