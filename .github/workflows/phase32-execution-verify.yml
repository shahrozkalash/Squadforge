name: Phase 32 Execution Infrastructure Verification

# Proves Phase 32 against a REAL Docker daemon on the runner:
#   - dockerd is reconfigured to serve TLS (client-certificate verified)
#     on tcp://127.0.0.1:2376 next to the unix socket,
#   - the gVisor runsc runtime is installed and registered,
#   - the gated integration tests then exercise TLS auth (valid and
#     wrong-CA certificates), runsc execution (verified via docker
#     inspect), memory/pids limit enforcement and teardown/sweep
#     cleanup. Nothing is mocked; a step that cannot work fails visibly.
# The Phase 32 unit tests and the Phase 10 suites run first without
# any daemon.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase32-execution-verify.yml'
      - 'server/execution/**'
      - 'tests/phase32_docker_integration.test.ts'
      - 'tests/phase32_execution_infrastructure.test.ts'

permissions:
  contents: read

jobs:
  phase32-execution-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SquadForge dependencies
        run: npm ci

      - name: Phase 32 unit tests (no daemon needed)
        run: >
          npx tsx --test tests/phase32_execution_infrastructure.test.ts
          tests/phase10_sandbox_integration.test.ts
          tests/phase10_end_to_end.test.ts

      - name: Check that Docker is available (socket service, not daemon yet)
        run: docker version

      - name: Check Phase 32 sources exist and are genuine
        run: |
          grep -rn "runsc" server/execution/docker-runner.ts | head -n 20
          grep -rn "createExecution\|docker" server/execution/ | head -n 40
          test -f tests/phase32_docker_integration.test.ts
          test -f tests/phase32_execution_infrastructure.test.ts

      - name: Generate TLS certificates (test CA + server + client)
        run: |
          set -eu
          mkdir -p certs
          openssl req -x509 -newkey rsa:4096 -days 2 -nodes \
            -keyout certs/ca-key.pem -out certs/ca.pem \
            -subj '/CN=SquadForge Test CA' -addext 'basicConstraints=critical,CA:true'
          openssl req -newkey rsa:4096 -nodes -keyout certs/server-key.pem -out certs/server.csr \
            -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > certs/server.ext
          openssl x509 -req -in certs/server.csr -CA certs/ca.pem -CAkey certs/ca-key.pem -CAcreateserial \
            -out certs/server-cert.pem -days 2 -extfile certs/server.ext
          openssl req -newkey rsa:4096 -nodes -keyout certs/client-key.pem -out certs/client.csr \
            -subj '/CN=phase32-client'
          openssl x509 -req -in certs/client.csr -CA certs/ca.pem -CAkey certs/ca-key.pem -CAcreateserial \
            -out certs/client-cert.pem -days 2
          openssl verify -CAfile certs/ca.pem certs/server-cert.pem certs/client-cert.pem

      - name: Register TLS daemon.json and restart Docker with TLS on 2376
        run: |
          set -eu
          jq --arg ca "$PWD/certs/ca.pem" --arg cert "$PWD/certs/server-cert.pem" --arg key "$PWD/certs/server-key.pem" \
            '. + {hosts: ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2376"],
                  tlsverify: true, tlscacert: $ca, tlscert: $cert, tlskey: $key}' \
            /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          sleep 5
          docker info --format 'runtimes: {{json .Runtimes}} storage: {{.Driver}}'
          curl --cacert certs/ca.pem --cert certs/client-cert.pem --key certs/client-key.pem https://127.0.0.1:2376/version

      - name: Install gVisor runsc runtime
        run: |
          set -eu
          # Pinned release: the release/latest/ alias now returns 404 (proven by run 45665209774); 20251110.0 is a real, verified release.
          curl -fsSL -o /tmp/runsc https://storage.googleapis.com/gvisor/releases/release/20251110.0/x86_64/runsc
          sudo install -m 0755 /tmp/runsc /usr/local/bin/runsc
          runsc --version
          # Registers the runsc runtime in /etc/docker/daemon.json.
          sudo runsc install -- --runtime=runsc
          sudo systemctl restart docker
          sleep 5
          docker info --format 'runtimes: {{json .Runtimes}}'

      - name: Genuine integration tests (real dockerd, TLS + runsc)
        run: |
          set -eu
          export DOCKER_HOST="tcp://127.0.0.1:2376"
          export DOCKER_TLS_VERIFY=1
          export DOCKER_CERT_PATH="${{ github.workspace }}/certs"
          docker info
          docker run --rm --runtime=runsc --memory=100m --pids-limit=10 alpine:latest echo runsc_ok
          npx tsx --test tests/phase32_docker_integration.test.ts | tee phase32-integration-output.txt

      - name: Validate genuine results (fail the workflow on any failed check)
        if: always()
        run: |
          set -e
          grep -q 'PHASE32_INTEGRATION_DONE' phase32-integration-output.txt || { echo "FAIL: integration suite did not finish"; exit 1; }
          grep -Eq '^# tests 7[[:space:]]*$' phase32-integration-output.txt || { echo "FAIL: integration suite did not report exactly 7 tests"; exit 1; }
          grep -Eq '^# pass 7[[:space:]]*$' phase32-integration-output.txt || { echo "FAIL: integration suite did not pass exactly 7 tests"; exit 1; }
          grep -Eq '^# fail 0[[:space:]]*$' phase32-integration-output.txt || { echo "FAIL: integration suite reported failures"; exit 1; }
          grep -Eq '^# skipped 0[[:space:]]*$' phase32-integration-output.txt || { echo "FAIL: integration suite skipped tests"; exit 1; }
          grep -q 'TLS: valid-client accepted' phase32-integration-output.txt || { echo "FAIL: TLS valid-client check missing"; exit 1; }
          grep -q 'TLS: wrong-CA client rejected' phase32-integration-output.txt || { echo "FAIL: TLS wrong-CA check missing"; exit 1; }
          grep -q 'RUNSC: container executed with runsc' phase32-integration-output.txt || { echo "FAIL: runsc execution check missing"; exit 1; }
          grep -q 'LIMITS: memory/pids enforced' phase32-integration-output.txt || { echo "FAIL: limits check missing"; exit 1; }
          grep -q 'TEARDOWN: containers swept' phase32-integration-output.txt || { echo "FAIL: teardown check missing"; exit 1; }
          echo 'All Phase 32 checks passed.'

      - name: Upload integration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase32-integration-output
          path: phase32-integration-output.txt
          if-no-files-found: warn
