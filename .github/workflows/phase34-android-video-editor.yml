name: Phase 34 Android Video Editor Genuine Build Verification

# Proves Phase 34's generated native Android video editor (ClipForge:
# Kotlin + Jetpack Compose + Media3) compiles with a real Gradle /
# Android SDK toolchain and that the generated app's own JVM unit
# tests (EditorOpsTest) pass. The SquadForge dev VM cannot run the
# Gradle daemon, so genuine compilation is proven here, exactly like
# Phase 17. Runs SquadForge's own generator + build pipeline
# unmodified, plus a broken-Kotlin negative test.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase34-android-video-editor.yml'
      - 'scripts/phase34-genuine-build.ts'
      - 'server/android/**'

permissions:
  contents: read

jobs:
  genuine-android-video-editor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          java -version

      - name: Install SquadForge dependencies
        run: npm ci

      - name: Genuine ClipForge build (Gradle assembleDebug + testDebugUnitTest)
        run: |
          set -eo pipefail
          npx tsx scripts/phase34-genuine-build.ts build | tee phase34-build-output.txt

      - name: Negative test - broken Kotlin source must fail honestly
        if: always()
        run: |
          set -eo pipefail
          npx tsx scripts/phase34-genuine-build.ts broken | tee phase34-broken-output.txt

      - name: Validate genuine results (fail the workflow on any failed check)
        if: always()
        run: |
          set -e
          echo "Validating Phase 34 evidence (a green workflow requires every check below):"
          grep -q '"ok":true' phase34-build-output.txt || { echo "FAIL: build RESULT_JSON is not ok:true"; exit 1; }
          grep -Eq '"apkBytes":[1-9][0-9]*' phase34-build-output.txt || { echo "FAIL: apkBytes is zero or missing"; exit 1; }
          grep -q 'UNIT_TESTS tests=19 failures=0 errors=0 skipped=0' phase34-build-output.txt || { echo "FAIL: JVM unit tests are not exactly 19 passed with 0 failures, 0 errors, 0 skipped (Gradle test-results XML)"; exit 1; }
          grep -q 'apksigner verification strictly PASSED' phase34-build-output.txt || { echo "FAIL: apksigner verification did not pass"; exit 1; }
          grep -q '"ok":true' phase34-broken-output.txt || { echo "FAIL: broken-source negative test did not fail honestly"; exit 1; }
          APK=$(find .android_artifacts -name '*.apk' -size +0 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "FAIL: no non-empty APK artifact on disk"; exit 1; }
          echo "All Phase 34 checks passed. APK: $APK"

      - name: Upload genuine build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase34-genuine-artifacts
          path: |
            .android_artifacts/**/*.apk
            phase34-build-output.txt
            phase34-broken-output.txt
          if-no-files-found: warn
